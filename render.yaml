# Blueprint de despliegue en un clic para Render (https://render.com).
# Crea: un servicio web (Docker) que sirve API + web, y una base PostgreSQL.
# El scrapeo real se ejecuta automáticamente (planificador integrado):
#   - poblado inicial al arrancar si la BD está vacía
#   - ejecución diaria a las 04:00 UTC
#
# Uso: Render → New → Blueprint → conecta este repo.
services:
  - type: web
    name: komparo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true        # firma de los JWT
      - key: ADMIN_TOKEN
        generateValue: true        # para lanzar scrapers manualmente si hace falta
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCRAPE_ON_STARTUP
        value: "true"
      - key: SCRAPE_HOUR
        value: "4"
      - key: PRODUCTS_PER_CATEGORY
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: komparo-db
          property: connectionString

databases:
  - name: komparo-db
    plan: free
