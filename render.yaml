# Blueprint de despliegue en un clic para Render (https://render.com).
# Crea un servicio web (Docker) que sirve API + web, y una base PostgreSQL.
#
# Uso: Render → New → Blueprint → conecta este repo.
services:
  - type: web
    name: komparo
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true        # firma de los JWT
      - key: DATABASE_URL
        fromDatabase:
          name: komparo-db
          property: connectionString

databases:
  - name: komparo-db
    plan: free
