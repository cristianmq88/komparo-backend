# ════════════════════════════════════════════════════════
# docker-compose.yml
# ════════════════════════════════════════════════════════
version: "3.9"

services:

  # ── Base de datos ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       superapp
      POSTGRES_USER:     superapp
      POSTGRES_PASSWORD: superapp_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Caché y cola de mensajes ──────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ── API principal ─────────────────────────────────────
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker Celery (ejecuta scrapers) ──────────────────
  worker:
    build: .
    command: celery -A scheduler.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - postgres
      - redis

  # ── Scheduler Celery Beat (programa scraping nocturno) ─
  beat:
    build: .
    command: celery -A scheduler.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - postgres
      - redis

  # ── Playwright (navegador para Ahorramas/Dia) ─────────
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data:
